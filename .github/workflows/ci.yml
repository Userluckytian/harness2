# harness2 CI：三平台 matrix，typecheck + test（mock provider，零 API key）。
# 注意：本仓库暂无远程；首次真实运行待用户建远程并授权 push（见 docs/issue-log/OPEN.md）。
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # 不指定 version：由 package.json 的 packageManager（pnpm@11.13.0）驱动，
      # 避免 action-setup 的严格相等比较与 "version: 11" 冲突（Multiple versions of pnpm specified）
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 浏览器工具测试用（惰性依赖：chromium 二进制不随 npm 安装，测试对缺失自动 skip）
      - name: Install chromium (browser tools tests)
        run: pnpm exec playwright install chromium

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm test

  # 桌面端构建矩阵（阶段 11 Task 3）：三平台各自构建 + artifact 上传（unsigned；
  # 构建失败即红）。GUI 测试不做（见 docs/issue-log/OPEN.md）；桌面单测为纯逻辑
  # （jsdom，无 GUI），仅 windows 跑一次即可覆盖。
  build-desktop:
    name: desktop build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: win-setup
            script: dist:win
            artifact: packages/desktop/release/*.exe
          - os: macos-latest
            name: mac-dmg
            script: dist:mac
            artifact: packages/desktop/release/*.dmg
          - os: ubuntu-latest
            name: linux-appimage
            script: dist:linux
            artifact: packages/desktop/release/*.AppImage
    env:
      # macOS 无证书（总控计划既定）：显式跳过签名发现，构建日志声明 unsigned
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Desktop unit tests（纯逻辑/jsdom，无 GUI；仅 windows 跑一次）
        if: runner.os == 'Windows'
        run: pnpm --filter @harness2/desktop test

      - name: Package（unsigned）
        run: pnpm --filter @harness2/desktop ${{ matrix.script }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: harness2-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
