# harness2 CI：三平台 matrix，typecheck + test（mock provider，零 API key）。
# 注意：本仓库暂无远程；首次真实运行待用户建远程并授权 push（见 docs/issue-log/OPEN.md）。
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # 不指定 version：由 package.json 的 packageManager（pnpm@11.13.0）驱动，
      # 避免 action-setup 的严格相等比较与 "version: 11" 冲突（Multiple versions of pnpm specified）
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm test

  # 桌面端构建矩阵（Task 6）：win 打包产物冒烟级别验证；GUI 测试不做（见 docs/issue-log/OPEN.md）
  desktop:
    name: desktop build (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Desktop unit tests（纯逻辑/jsdom，无 GUI）
        run: pnpm --filter @harness2/desktop test

      - name: Package win nsis（unsigned）
        run: pnpm --filter @harness2/desktop dist

      - name: Upload nsis artifact
        uses: actions/upload-artifact@v4
        with:
          name: harness2-win-setup
          path: packages/desktop/release/*.exe
          if-no-files-found: error
