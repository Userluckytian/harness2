# harness2 CI：三平台 matrix，typecheck + test（mock provider，零 API key）。
# 远程：https://github.com/Userluckytian/harness2（public → Actions 分钟免费）。
# 2026-10-24 ZS6-T4 案 B 退役：旧壳 desktop/ui-shared/web 三包删除 → test job 收敛为
# core/gateway/cli（+zcode-adapter 经 workspace `pnpm build`/test 覆盖），desktop 打包 job
# 移除（产品桌面端=ZCode 壳装配通道 `scripts/zs6/zs6-pack.ps1`，本地出包，不入 CI）。
# 本 workflow 只在 push/PR 时触发，本地未 push 的提交不会被 CI 验证。
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      # 不指定 version：由 package.json 的 packageManager（pnpm@11.13.0）驱动，
      # 避免 action-setup 的严格相等比较与 "version: 11" 冲突（Multiple versions of pnpm specified）
      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 浏览器工具测试用（惰性依赖：chromium 二进制不随 npm 安装，测试对缺失自动 skip）。
      # playwright 是 @harness2/core 的依赖，须在 core 包内 exec（根目录无该二进制，否则报
      # "Command playwright not found"——2026-09-07 审查发现三平台 test job 卡在此步）
      - name: Install chromium (browser tools tests)
        run: pnpm --filter @harness2/core exec playwright install chromium

      # typecheck 必须在 build 之后：core 的 api-surface.test.ts 引用 dist/（gitignored），
      # 全新 runner 上 dist 不存在，先 build 才能让 typecheck 解析到 dist/index.js。
      # （2026-09-07 审查发现的顺序缺陷：原顺序 install→typecheck→test 在干净环境必然 TS2307）
      - name: Build packages
        id: build
        run: pnpm build

      # --no-bail：多包类型错误一次报全，不在第一个包就中断
      - name: Typecheck
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm -r --no-bail run typecheck

      # B2：lint 为必过项（ESLint flat + prettier --check）。放在 build 之后：
      # projectService 需要解析各包 tsconfig，且 core 的 api-surface.test.ts 引用 dist/。
      #
      # 以下均拆成独立步骤（消除单点红掩盖：2026-09-11 CI #61 在 core 失败后，
      # 其余包当次根本没跑到，见 docs/issue-log/OPEN.md）。
      # 条件只看 build 成败：build 红则后续全跳（无意义）；其余步骤互不遮蔽
      # —— typecheck/lint 红不挡测试，某一包红不挡其余包；任一步红则整个 job 红。
      - name: Lint (ESLint)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm exec eslint .

      - name: Lint (Prettier check)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm exec prettier --check .

      - name: Test core
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --filter @harness2/core test

      - name: Test gateway
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --filter @harness2/gateway test

      # cli 的包名就是 harness2（非 @harness2/cli），此处不能写成 scope 形式
      - name: Test cli
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --filter harness2 test

      # zcode-adapter（ZS 内心装配，2026-10 起为活跃开发面）：与三包同口径独立步骤
      - name: Test zcode-adapter
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --filter @harness2/zcode-adapter test

  # 文档站（阶段 12 Task 2）：docsify 零构建单页（docs/site/index.html）+ 根/文档 md 拷贝暂存部署。
  # 开启前提：仓库 Settings → Pages 来源选 GitHub Actions（见 docs/issue-log/OPEN.md——待人类操作）。
  pages:
    name: pages (docsify)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Stage docs site（零构建：仅文件拷贝）
        run: |
          mkdir -p staging
          cp docs/site/index.html staging/
          cp README.md architecture.md CHANGELOG.md staging/
          cp docs/*.md staging/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: staging

      - id: deployment
        uses: actions/deploy-pages@v4
