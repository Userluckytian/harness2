# harness2 Release：push tag v* → 三平台 build+test → pnpm publish（NPM_TOKEN）。
# 发布为人类授权动作：NPM_TOKEN 未配置时条件跳过 publish 并输出明确 notice（不误发）；
# 已配置但发布失败（token 失效/包名冲突/网络）→ publish 步骤失败 → workflow 红
# （审查 P1-1：不用 continue-on-error，避免"跳过"与"真实失败"混同造成假绿）。
name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      # 不指定 version：由 package.json 的 packageManager（pnpm@11.13.0）驱动
      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # typecheck 必须在 build 之后：core 的 api-surface.test.ts 引用 dist/（gitignored），
      # 全新 runner 上 dist 不存在，先 build 才能让 typecheck 解析到 dist/index.js。
      # （2026-09-07 审查发现的顺序缺陷：原顺序 install→typecheck→test 在干净环境必然 TS2307）
      - name: Build packages
        run: pnpm build

      - name: Typecheck
        run: pnpm -r --no-bail run typecheck

      # 测试与 ci.yml 完全同口径：**逐包顺序**各一步（单点红不遮蔽其余包）。
      # 原实现是一步全量 `pnpm test` = `pnpm -r run test` **并行**跑六包 —— 4 核 runner 上
      # 峰值过载，cli 的 spawn 型用例（crash-drill/export/memory，默认 5s 超时）偶发红：
      # 2026-10-13 v1.0.0 run 38388019115 的 test (windows-latest) 即败于此步（同码 40 分钟前
      # ci.yml 分包版 windows 全绿，可对照；flaky 模式亦见 docs/issue-log/OPEN.md「cli 全量
      # spawn 型用例超时 flaky」）。分包顺序跑把并发峰值降回与 CI 一致，不需要放宽超时。
      - name: Test core
        run: pnpm --filter @harness2/core test

      - name: Test gateway
        run: pnpm --filter @harness2/gateway test

      # cli 的包名就是 harness2（非 @harness2/cli），此处不能写成 scope 形式
      - name: Test cli
        run: pnpm --filter harness2 test

      - name: Test desktop
        run: pnpm --filter @harness2/desktop test

      - name: Test ui-shared
        run: pnpm --filter @harness2/ui-shared test

      - name: Test web
        run: pnpm --filter @harness2/web test

  publish:
    name: publish (npm)
    needs: test
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      # 无 token → 本步骤条件跳过（下方 notice 步骤说明）；
      # 有 token → 发布失败（token 失效/包名冲突/网络）直接红，不加 continue-on-error
      - name: Publish（需 NPM_TOKEN；未配置时条件跳过）
        if: env.NPM_TOKEN != ''
        run: |
          echo "//registry.npmjs.org/:_authToken=\${NPM_TOKEN}" > ~/.npmrc
          # workspace:^ 依赖按拓扑序发布：先内核后 CLI（pnpm publish 自动替换 workspace: 协议）
          pnpm --filter @harness2/core publish --access public --no-git-checks
          pnpm --filter harness2 publish --access public --no-git-checks

      - name: Skip notice（未配置 NPM_TOKEN，明确跳过而非静默失败）
        if: env.NPM_TOKEN == ''
        run: |
          echo "::notice::NPM_TOKEN 未配置，本次 release 跳过 npm publish（发布需人类授权，见 docs/issue-log/OPEN.md）"
          echo "::notice::待办：配置 NPM_TOKEN secret 并人工授权后重新触发发布（重推 tag 或手跑 workflow）"

  # 桌面产物（阶段 11 Task 3）：三平台 unsigned 构建 → artifact → 附加到 GitHub Release。
  # macOS 无证书：CSC_IDENTITY_AUTO_DISCOVERY=false + identity: null 显式跳过签名/公证。
  desktop:
    name: desktop artifacts (${{ matrix.name }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: win-setup
            script: dist:win
            artifact: packages/desktop/release/*.exe
          - os: macos-latest
            name: mac-dmg
            script: dist:mac
            artifact: packages/desktop/release/*.dmg
          - os: ubuntu-latest
            name: linux-appimage
            script: dist:linux
            artifact: packages/desktop/release/*.AppImage
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 必须先 build 全仓：dist:* 里的 `pnpm --filter harness2 bundle` 用 esbuild 打包
      # `src/serve-entry.ts`，其中 `import ... from '@harness2/core'` 经 node 解析落到
      # `packages/core/dist/index.js`（core 的 exports 只指 dist，全仓也没有 tsconfig paths 别名）。
      # 干净 runner 上 dist 不存在 → bundle 直接 ERR_PNPM_RECURSIVE_RUN_FIRST_FAIL。
      # 2026-10-13 实测取证：把 packages/core/dist 临时改名后复跑 `pnpm --filter harness2 bundle`
      # 必红（Exit status 1）。ci.yml 的 build-desktop job 本就有这步，release 的 desktop job 漏了，
      # 首次真跑必失败——补上与 ci.yml 同口径的 build。
      - name: Build packages
        run: pnpm build

      - name: Package（unsigned）
        run: pnpm --filter @harness2/desktop ${{ matrix.script }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: harness2-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release-assets:
    name: attach desktop artifacts to release
    needs: [publish, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Attach to GitHub Release（幂等 + 显式诊断 + notes 回退）
        # 两次真跑（v1.0.0 @629de9a / @0941211）均在本步 14~20s 失败且 Release 未建出来。
        # 根因（推断已收敛）：本 job 无 actions/checkout，gh CLI 在既无本地 git 仓库、又无
        # GH_REPO 时解析不出目标仓库 → `gh release view/create` 直接报 "no repository"退出。
        # 修法：显式 GH_REPO=github.repository（gh 官方支持的 repo 上下文来源）。
        # 诊断加固：失败时把 stderr 压成单行 ::error:: 注解——未登录也能在 Run 页面看到真因。
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -u
          one_line() { tr '\n\r' '  ' | cut -c1-400; }
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "::group::create release $TAG"
            if ! gh release create "$TAG" --generate-notes --title "$TAG" 2>err.log; then
              echo "::warning::--generate-notes 失败：$(one_line <err.log)"
              gh release create "$TAG" --title "$TAG" \
                --notes "harness2 $TAG：三平台桌面产物（win nsis+portable / mac dmg arm64+x64 / linux AppImage），全部 unsigned。" \
                2>err.log || { echo "::error::gh release create 失败（含回退）：$(one_line <err.log)"; exit 1; }
            fi
            echo "::endgroup::"
          fi
          gh release view "$TAG" --json tagName,uploadUrl >/dev/null || { echo "::error::Release $TAG 视图复核失败"; exit 1; }
          gh release upload "$TAG" release-assets/* --clobber
          echo "::notice::桌面产物已附加到 Release $TAG（全部 unsigned，无签名/公证）"
