# harness2 Release：push tag v* → 三平台 build+test → pnpm publish（NPM_TOKEN）。
# 发布为人类授权动作：NPM_TOKEN 未配置时条件跳过 publish 并输出明确 notice（不误发）；
# 已配置但发布失败（token 失效/包名冲突/网络）→ publish 步骤失败 → workflow 红
# （审查 P1-1：不用 continue-on-error，避免"跳过"与"真实失败"混同造成假绿）。
name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      # 不指定 version：由 package.json 的 packageManager（pnpm@11.13.0）驱动
      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # typecheck 必须在 build 之后：core 的 api-surface.test.ts 引用 dist/（gitignored），
      # 全新 runner 上 dist 不存在，先 build 才能让 typecheck 解析到 dist/index.js。
      # （2026-09-07 审查发现的顺序缺陷：原顺序 install→typecheck→test 在干净环境必然 TS2307）
      - name: Build packages
        run: pnpm build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm test

  publish:
    name: publish (npm)
    needs: test
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      # 无 token → 本步骤条件跳过（下方 notice 步骤说明）；
      # 有 token → 发布失败（token 失效/包名冲突/网络）直接红，不加 continue-on-error
      - name: Publish（需 NPM_TOKEN；未配置时条件跳过）
        if: env.NPM_TOKEN != ''
        run: |
          echo "//registry.npmjs.org/:_authToken=\${NPM_TOKEN}" > ~/.npmrc
          # workspace:^ 依赖按拓扑序发布：先内核后 CLI（pnpm publish 自动替换 workspace: 协议）
          pnpm --filter @harness2/core publish --access public --no-git-checks
          pnpm --filter harness2 publish --access public --no-git-checks

      - name: Skip notice（未配置 NPM_TOKEN，明确跳过而非静默失败）
        if: env.NPM_TOKEN == ''
        run: |
          echo "::notice::NPM_TOKEN 未配置，本次 release 跳过 npm publish（发布需人类授权，见 docs/issue-log/OPEN.md）"
          echo "::notice::待办：配置 NPM_TOKEN secret 并人工授权后重新触发发布（重推 tag 或手跑 workflow）"

  # 桌面产物（阶段 11 Task 3）：三平台 unsigned 构建 → artifact → 附加到 GitHub Release。
  # macOS 无证书：CSC_IDENTITY_AUTO_DISCOVERY=false + identity: null 显式跳过签名/公证。
  desktop:
    name: desktop artifacts (${{ matrix.name }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: win-setup
            script: dist:win
            artifact: packages/desktop/release/*.exe
          - os: macos-latest
            name: mac-dmg
            script: dist:mac
            artifact: packages/desktop/release/*.dmg
          - os: ubuntu-latest
            name: linux-appimage
            script: dist:linux
            artifact: packages/desktop/release/*.AppImage
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package（unsigned）
        run: pnpm --filter @harness2/desktop ${{ matrix.script }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: harness2-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release-assets:
    name: attach desktop artifacts to release
    needs: [publish, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Attach to GitHub Release（无 Release 则生成后附加）
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes --title "$TAG"
          gh release upload "$TAG" release-assets/* --clobber
          echo "::notice::桌面产物已附加到 Release $TAG（全部 unsigned，无签名/公证）"
