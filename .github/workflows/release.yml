# harness2 Release：push tag v* → 三平台 build+test → pnpm publish（NPM_TOKEN）。
# 发布为人类授权动作：NPM_TOKEN 未配置时条件跳过 publish 并输出明确 notice（不误发）；
# 已配置但发布失败（token 失效/包名冲突/网络）→ publish 步骤失败 → workflow 红
# （审查 P1-1：不用 continue-on-error，避免"跳过"与"真实失败"混同造成假绿）。
name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      # 不指定 version：由 package.json 的 packageManager（pnpm@11.13.0）驱动
      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # typecheck 必须在 build 之后：core 的 api-surface.test.ts 引用 dist/（gitignored），
      # 全新 runner 上 dist 不存在，先 build 才能让 typecheck 解析到 dist/index.js。
      # （2026-09-07 审查发现的顺序缺陷：原顺序 install→typecheck→test 在干净环境必然 TS2307）
      - name: Build packages
        run: pnpm build

      - name: Typecheck
        run: pnpm -r --no-bail run typecheck

      # 测试与 ci.yml 完全同口径：**逐包顺序**各一步（单点红不遮蔽其余包）。
      # 原实现是一步全量 `pnpm test` = `pnpm -r run test` **并行**跑六包 —— 4 核 runner 上
      # 峰值过载，cli 的 spawn 型用例（crash-drill/export/memory，默认 5s 超时）偶发红：
      # 2026-10-13 v1.0.0 run 38388019115 的 test (windows-latest) 即败于此步（同码 40 分钟前
      # ci.yml 分包版 windows 全绿，可对照；flaky 模式亦见 docs/issue-log/OPEN.md「cli 全量
      # spawn 型用例超时 flaky」）。分包顺序跑把并发峰值降回与 CI 一致，不需要放宽超时。
      - name: Test core
        run: pnpm --filter @harness2/core test

      - name: Test gateway
        run: pnpm --filter @harness2/gateway test

      # cli 的包名就是 harness2（非 @harness2/cli），此处不能写成 scope 形式
      - name: Test cli
        run: pnpm --filter harness2 test

      # ZS6-T4 退役（2026-10-24）：desktop/ui-shared/web 三包已删，测试步同步移除

  publish:
    name: publish (npm)
    needs: test
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      # 无 token → 本步骤条件跳过（下方 notice 步骤说明）；
      # 有 token → 发布失败（token 失效/包名冲突/网络）直接红，不加 continue-on-error
      - name: Publish（需 NPM_TOKEN；未配置时条件跳过）
        if: env.NPM_TOKEN != ''
        run: |
          echo "//registry.npmjs.org/:_authToken=\${NPM_TOKEN}" > ~/.npmrc
          # workspace:^ 依赖按拓扑序发布：先内核后 CLI（pnpm publish 自动替换 workspace: 协议）
          pnpm --filter @harness2/core publish --access public --no-git-checks
          pnpm --filter harness2 publish --access public --no-git-checks

      - name: Skip notice（未配置 NPM_TOKEN，明确跳过而非静默失败）
        if: env.NPM_TOKEN == ''
        run: |
          echo "::notice::NPM_TOKEN 未配置，本次 release 跳过 npm publish（发布需人类授权，见 docs/issue-log/OPEN.md）"
          echo "::notice::待办：配置 NPM_TOKEN secret 并人工授权后重新触发发布（重推 tag 或手跑 workflow）"

  # ZS6-T4 退役（2026-10-24）：旧壳三平台 desktop 产物 job 与 release-assets 附加 job 已移除。
  # 现行桌面产物 = 本地 zs6-pack 通道（scripts/zs6/zs6-pack.ps1，win NSIS/portable unsigned），
  # 由人类在 V9 发版时手动附加到 GitHub Release（材料：docs/ai-framework/plans/zs6-release-draft.md）。
