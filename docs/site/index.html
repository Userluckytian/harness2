<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>harness2 文档</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- docsify 零构建文档站（阶段 12 Task 2）：CDN 单页，无任何构建工具链（不引 vitepress/mkdocs）。
       部署布局见 .github/workflows/ci.yml 的 pages job：index.html + 根/文档 md 一起暂存。
       本地预览：把 index.html 与侧栏所列 md 放同一目录后 `npx http-server <目录>`（docsify 经 XHR 取 md，file:// 在部分浏览器会被 CORS 拦截）。 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/themes/vue.css" />
  </head>
  <body>
    <div id="app">加载中…（docsify 经 CDN 加载，需可访问 jsdelivr）</div>
    <nav>
      <ul>
        <li><a href="#/README">README</a></li>
        <li><a href="#/architecture">架构说明</a></li>
        <li><a href="#/API-STABILITY">API 稳定承诺</a></li>
        <li><a href="#/MIGRATION">迁移指南</a></li>
        <li><a href="#/RELEASE-CHECKLIST">发布回归汇总</a></li>
        <li><a href="#/ROADMAP">路线图</a></li>
        <li><a href="#/HANDOFF">交接入口</a></li>
        <li><a href="#/CHANGELOG">变更记录</a></li>
      </ul>
    </nav>
    <!-- 安全边界（如实声明）：v1 插件与主进程同进程运行（非隔离），manifest 权限仅为 API 层约束，不提供沙箱。
         B4-3 要求文档站显著位置可见；docsify 只替换 #app，此静态注记常驻每一页顶部。 -->
    <div
      style="
        max-width: 860px;
        margin: 14px auto 0;
        padding: 8px 14px;
        font-size: 13px;
        color: #b44;
        border: 1px solid #e0b4b4;
        border-radius: 6px;
        background: #fdf6f6;
      "
    >
      插件安全边界（如实声明）：v1 插件与主进程同进程运行（非隔离），manifest 权限仅为 API 层约束，不提供沙箱。
    </div>
    <script>
      window.$docsify = {
        name: 'harness2',
        repo: 'https://github.com/Userluckytian/harness2',
        homepage: 'README.md',
        subMaxLevel: 3,
        auto2top: true,
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  </body>
</html>
