# electron-builder 配置（三平台，unsigned；产物落 release/，已 gitignore）。
# 打包后的 serve 子进程 = extraResources 的 cli 单文件 bundle（ELECTRON_RUN_AS_NODE 运行，
# 不依赖系统 node 与 node_modules）。
# 签名口径（总控计划既定）：全平台 unsigned——win 默认无证书；mac identity: null 显式跳过
# 签名/公证（CI 另设 CSC_IDENTITY_AUTO_DISCOVERY=false 双保险）；无自动更新。
appId: dev.harness2.desktop
productName: harness2
copyright: harness2
directories:
  output: release
files:
  - dist-electron/**/*
  - dist/renderer/**/*
  - package.json
extraResources:
  - from: ../cli/dist-bundle
    to: cli
win:
  target:
    - target: nsis
      arch:
        - x64
    # portable = 免安装单文件 exe（双击即用，适合分发试用；2026-10-13 用户推荐项）。
    # 与 nsis 同 glob（release/*.exe）被 ci/release 的 Upload artifact 一并收集，workflow 零改动。
    - target: portable
      arch:
        - x64
  # 显式产物名（默认含空格，作 Release 资产不友好）：三平台命名风格统一。
  artifactName: harness2-${version}-win-${arch}.${ext}
nsis:
  # oneClick: false = 走「辅助安装向导」（可选安装路径/快捷方式），而非一键静默装到默认目录。
  # 2026-10-11 用户反馈「不让我选择安装路径」——oneClick: true 时 NSIS 直接开装、无目录页。
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
portable:
  artifactName: harness2-${version}-win-${arch}-portable.${ext}
mac:
  # 无证书构建：identity: null = 显式跳过签名（electron-builder 不再自动发现证书）
  identity: null
  category: public.app-category.developer-tools
  artifactName: harness2-${version}-mac-${arch}.${ext}
  target:
    - target: dmg
      arch:
        - arm64
        - x64
linux:
  # AppImage 文件名：不能取 scoped 包名 @harness2/desktop 的派生名（@harness2desktop 含 @ 非法），
  # 显式用安全名——2026-09-07 审查发现 linux-appimage 打包失败（win/mac 不走该命名，未受影响）
  executableName: harness2
  artifactName: harness2-${version}-linux-${arch}.${ext}
  target:
    - target: AppImage
      arch:
        - x64
  category: Development
# publish 留空防止意外发布配置（发布走 release workflow 的 npm publish / Release 附加）
publish: null
