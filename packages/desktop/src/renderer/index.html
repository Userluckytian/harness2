<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'"
    />
    <title>harness2</title>
    <!-- Z1-05 首屏防闪：外部脚本（CSP 无 script-src，内联会被 default-src 'self' 拦截）；
         在模块脚本之前同步写 <html> 主题，避免 React 挂载前白闪。 -->
    <script src="/theme-boot.js"></script>
    <!-- U2-A5 启动壳：① body 背景二分（深色 #161616 / 浅色 #f8f8f8，与主进程
         BrowserWindow backgroundColor 同值，消除首帧白闪）——theme-boot 已按偏好同步写
         <html> 类，故类规则优先于 prefers-color-scheme（后者仅作 theme-boot 失败时的兜底）；
         ② 48px 顶部 drag 条：React 挂载前标题带也能拖动窗口；App 根（.desktop-window-frame）
         挂载完成由 main.tsx 写入 body[data-shell-ready]（flushSync 同步提交），
         CSS 仅依赖该确定性标志隐藏 boot-drag，避免 .desktop-window-frame 类名重构/挂载前抛错
         时 drag 条永久盖住顶 48px。
         另一口径（备用）：启动 3s 后若壳仍未挂载，脚本自行移除 #boot-drag 节点——本实现未采用，
         保留供回退参考（main.tsx 钩子失效时启用）。
         style-src 'unsafe-inline' 已在 CSP 中放行内联样式。 -->
    <style>
      body {
        background: #f8f8f8;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #161616;
        }
      }
      html.theme-zai-light body {
        background: #f8f8f8;
      }
      html.theme-zai-dark body {
        background: #161616;
      }
      #boot-drag {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 48px;
        -webkit-app-region: drag;
        z-index: 0;
      }
      body[data-shell-ready='1'] #boot-drag {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="boot-drag" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
